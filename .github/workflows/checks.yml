name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly; the `gate` job below skips the tests unless amaster moved

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (the version uv.lock pins)
        run: python -m pip install ruff==0.16.10
      - name: ruff check
        run: ruff check .
      - name: SPEC consistency
        run: python scripts/check_spec.py docs/SPEC.md

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not just the tip
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: gitleaks git --config .gitleaks.toml --no-banner --redact --verbose .
      - name: Scan the checked-out files
        run: gitleaks dir --config .gitleaks.toml --no-banner --redact --verbose .

  publication:
    runs-on: ubuntu-latest
    environment: publication   # L4_PUBLICATION_RULES is an environment secret, not a repository one
    env:
      L4_PUBLICATION_RULES: ${{ secrets.L4_PUBLICATION_RULES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publication scrub check
        if: env.L4_PUBLICATION_RULES != ''
        run: python scripts/dev/scrub.py check --rules-env L4_PUBLICATION_RULES
      - name: Skipped (no rules secret)
        if: env.L4_PUBLICATION_RULES == ''
        run: echo "L4_PUBLICATION_RULES is not set; publication scrub check skipped"

  # ---- the unit suite (L4-ACT-007) -------------------------------------------------------------------------------
  # Runs on pull requests, workflow_dispatch and the nightly schedule, never on a plain push (private-repo minutes).
  # lint, secrets and publication above keep running on every trigger, push included.

  # Decides whether the tests run. pull_request and workflow_dispatch always run them. A scheduled run proceeds
  # only when the commit it checks out differs from the head sha of the last SUCCESSFUL scheduled run of this
  # workflow (read with the workflow's own GITHUB_TOKEN, `actions: read`). A failed or cancelled nightly is never
  # "the last success", so an unchanged amaster is retried until a night passes; a nightly that skipped the tests
  # concludes success with the same sha, which keeps the chain correct.
  gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/${REPO}/actions/workflows/checks.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "amaster has not moved since the last successful nightly (${last:0:10}); tests skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "amaster moved (last successful nightly: ${last:0:10}, now ${HEAD_SHA:0:10}); tests run"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: gate
    if: github.event_name != 'push' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv (the version the lock was made with)
        run: pipx install uv==0.10.0
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: Unit tests, shard ${{ matrix.shard }} of 8
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t files < <(python3 scripts/dev/shards.py --shard "$SHARD" --of 8)
          echo "shard $SHARD of 8: ${#files[@]} files"
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::shard $SHARD is empty; pytest would run everything"; exit 1; fi
          uv run --frozen pytest -q -m "not live" "${files[@]}"

  # One check for branch protection: it fails when any shard failed or was cancelled, and when the tests were
  # due to run but did not.
  tests-summary:
    needs: [gate, tests]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every shard passed
        env:
          GATE_RUN: ${{ needs.gate.outputs.run }}
          GATE_RESULT: ${{ needs.gate.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "gate=$GATE_RESULT (run=$GATE_RUN) tests=$TESTS_RESULT"
          if [ "$GATE_RESULT" != "success" ]; then exit 1; fi
          if [ "$GATE_RUN" = "false" ]; then echo "tests skipped by the nightly gate"; exit 0; fi
          if [ "$TESTS_RESULT" != "success" ]; then exit 1; fi
