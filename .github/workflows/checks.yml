name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (the version uv.lock pins)
        run: python -m pip install ruff==0.16.10
      - name: ruff check
        run: ruff check .
      - name: SPEC consistency
        run: python scripts/check_spec.py docs/SPEC.md

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not just the tip
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: gitleaks git --config .gitleaks.toml --no-banner --redact --verbose .
      - name: Scan the checked-out files
        run: gitleaks dir --config .gitleaks.toml --no-banner --redact --verbose .

  publication:
    runs-on: ubuntu-latest
    environment: publication   # L4_PUBLICATION_RULES is an environment secret, not a repository one
    env:
      L4_PUBLICATION_RULES: ${{ secrets.L4_PUBLICATION_RULES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publication scrub check
        if: env.L4_PUBLICATION_RULES != ''
        run: python scripts/dev/scrub.py check --rules-env L4_PUBLICATION_RULES
      - name: Skipped (no rules secret)
        if: env.L4_PUBLICATION_RULES == ''
        run: echo "L4_PUBLICATION_RULES is not set; publication scrub check skipped"
