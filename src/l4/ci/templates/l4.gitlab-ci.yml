# Written by `l4 init --ci gitlab` (forge-and-ci 1.15, the M1.1 routed job). Add it to .gitlab-ci.yml with
#   include:
#     - local: .l4/ci/l4.gitlab-ci.yml
# One job, `l4`, decides for itself whether there is work: `l4 run` plans every unit and runs the actionable ones, and
# logs "nothing to do" and exits 0, before any lease, worktree or probe, when there are none. It starts on a push to the
# base branch (`forge.base_branch`; a merge), on a push to <forge.branch_prefix>** (a human's answer or spec edit) and
# on a schedule, web, api or trigger pipeline. A push to another branch whose message has an `L4-Run` trailer is the harness's own and starts nothing.
# The base branch is exempt: a fast-forward merge makes the hand-off commit its head, and that merge must be swept
# (the harness never pushes there, the archive is a merge request). `.post` is a stage every pipeline has. Every
# script line is one command; a line with a colon and a space is quoted as a whole. `l4 setup gitlab` triggers one
# pipeline with L4_ADOPTION_CHECK=1: the doctor line then adds `--adoption` (GATE-001, the gates at HEAD, on this
# runner). Only whether the variable is non-empty matters: its value never reaches the command line.
l4:
  stage: .post
  needs: []  # start at once: the repository's own jobs, red or green, neither delay nor skip the harness
  tags: [agentic]
  resource_group: l4
  # the harness's own secrets are CI/CD variables scoped to the environment `l4` (the --environment-scope of
  # scripts/forge/gitlab_bot_token.py), so the project's own jobs never see them (HB-2); `prepare` makes the
  # environment exist without a deployment
  environment:
    name: l4
    action: prepare
  interruptible: false
  timeout: 180m
  allow_failure:
    exit_codes: [10, 11, 12, 13]  # 13: a halt is unit state (label, sticky note, exit_reason), not a failed job
  variables:
    GIT_DEPTH: "0"
    L4_BASE_BRANCH: "@@BASE@@"  # forge.base_branch, written by `l4 init` and `l4 upgrade` (L4-OPS-016)
  rules:
    - if: '$CI_COMMIT_BRANCH != "@@BASE@@" && $CI_COMMIT_MESSAGE =~ /\nL4-Run: / && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "@@BASE@@"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^@@PREFIX_RE@@/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'
  before_script:
    # on any other branch the harness and the config come from the head of the base branch, not from the pushed one;
    # the echo is the proof in the job log (GitLab echoes this whole line either way)
    - '[ "$CI_COMMIT_BRANCH" = "$L4_BASE_BRANCH" ] || { git fetch --quiet origin "+refs/heads/$L4_BASE_BRANCH:refs/remotes/origin/$L4_BASE_BRANCH" && git checkout --quiet --detach "origin/$L4_BASE_BRANCH" && echo "l4: base checkout $(git rev-parse HEAD)"; }'
  script:
    - '.l4/bin/l4 doctor --ci --fix ${L4_ADOPTION_CHECK:+--adoption} || .l4/bin/l4 ci map-exit $?'
    - '.l4/bin/l4 plan --sweep || .l4/bin/l4 ci map-exit $?'
    - '.l4/bin/l4 run || .l4/bin/l4 ci map-exit $?'
  after_script:
    - '.l4/bin/l4 status'
  artifacts:
    when: always
    paths: [.l4-out/]
    expire_in: 1 week
