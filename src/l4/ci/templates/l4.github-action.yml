# Written by `l4 init --ci github --action` (adoption-kit L4-ACT-004). The same job as `l4 init --ci github` writes, with
# the harness delivered by the setup action: its `uses:` line is the only pin (a full commit sha; the comment names the
# release it was resolved from), `l4 upgrade --harness-ref` moves it, and Dependabot can propose the moves. One job, `l4`,
# decides for itself whether there is work: `l4 run` plans every unit and runs the actionable ones, and exits 0 with
# "nothing to do" before any lease, worktree or probe when there are none. It starts on a push to the base branch (a
# merge), on a push to the unit-branch prefix (a human's answer or spec edit), on a schedule and by hand. There is no
# pull_request trigger, so a fork never runs it (L4-CI-003). A push whose message has an `L4-Run: ` trailer is the
# harness's own and starts nothing, except on the base branch. Checkout keeps no credentials: the harness hands git the
# token per command (L4-SEC-005).
name: l4
on:
  push:
    branches: [@@BASE@@, @@PREFIX@@]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: write
  actions: write
jobs:
  l4:
    if: @@IF@@
    runs-on: @@RUNS_ON@@
@@ENVIRONMENT@@
    timeout-minutes: @@JOB_TIMEOUT@@
    concurrency:
      group: l4
      cancel-in-progress: false
    env:
      @@TOKEN_ENV@@: ${{ secrets.@@TOKEN_ENV@@ }}
      L4_JOB_TIMEOUT_MINUTES: "@@JOB_TIMEOUT@@"
      L4_BASE_BRANCH: @@BASE_ENV@@
@@CREDENTIAL_ENV@@
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # on any other branch the harness and the config come from the head of the base branch, not from the pushed one
      # (L4-GHP-005); the branch name reaches the shell only through the job env
      - name: base checkout
        if: ${{ github.ref_name != env.L4_BASE_BRANCH }}
        run: |
          git fetch --quiet origin "+refs/heads/$L4_BASE_BRANCH:refs/remotes/origin/$L4_BASE_BRANCH" && git checkout --quiet --detach "origin/$L4_BASE_BRANCH" && echo "l4: base checkout $(git rev-parse HEAD)"
@@ACTION_STEP@@
      - name: doctor
        run: l4 @@DOCTOR@@ || l4 ci map-exit $?
@@CLIS_SAVE@@
      - name: plan
        run: l4 plan --sweep || l4 ci map-exit $?
      - name: run
        run: l4 run || l4 ci map-exit $?
      - name: status
        if: ${{ always() }}
        run: l4 status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: l4-out
          path: .l4-out/
          retention-days: 7
