# Secret scanning for files and every commit (.github/workflows/checks.yml).
# The default gitleaks rules apply; the allowlists below cover only reviewed non-secrets.
#
# They match content, never paths: gitleaks 8.30 applies an allowlist's `paths` before its other criteria (even
# with condition = "AND"), so a path entry would hide every finding in that tree, recorded CI logs included.

[extend]
useDefault = true

[[allowlists]]
description = "digests in recorded evidence: S1 item keys and model file sha256 values"
regexTarget = "match"
regexes = [
  '''^item_key": "[0-9a-f]{32}"$''',
  '''^tokenizer(_config)?\.json": "[0-9a-f]{64}"$''',
]

[[allowlists]]
description = "uv cache digests in recorded cache.seeded events (field `digest`; `key` before 0.4.2, kept for recorded evidence)"
regexTarget = "line"
regexes = ['''"type": "cache\.seeded", "cache": "[a-z]+", "(digest|key)": "[0-9a-f]{64}"''']

[[allowlists]]
description = "repository keys in recorded ledgers: `<slug of the repository name>-<10 hex digits of the sha256 of its remote>` (l4.vcs.repokey), a public identifier, not a credential"
regexTarget = "match"
regexes = ['''^repository_key": "[a-z0-9-]{1,24}-[0-9a-f]{10}"$''']

[[allowlists]]
description = "credential-shaped fakes in tests and spec examples: obvious runs, a FAKE marker, an unsigned JWT"
regexTarget = "secret"
regexes = ['''(?i)fake|supersecret|0123456789|123456|abcdefgh''', '''^eyJhbGciOiJub25lIn0\.''']

[[allowlists]]
description = "the private-key header the excerpt redaction test assembles around a fake body"
regexTarget = "secret"
regexes = ['''""\.join\(f"E''']

[[allowlists]]
description = "the made-up credentials l4-setup's test passes to prove the script never prints one (tok-<tool>-<3 digits>)"
regexTarget = "secret"
regexes = ['''^tok-(claude|codex|kiro|forge|anth)-[0-9]{3}$''']
