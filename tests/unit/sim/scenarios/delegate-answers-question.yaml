# The implementer asks a question, there is no clarifier, and the delegate (a scripted `fake` profile of
# `roles.delegate`) answers it in the run that parks the unit; the next run reads the answer and finishes the unit.
# The lifecycle takes no new edge: awaiting_human -> implementing on `answers_submitted`, as for a person's answer.
name: delegate-answers-question
fixture: openspec-basic
max_runs: 2
config:
  delegate: {enabled: true, scope: all}
profiles:
  implementer:
    steps:
      - when: {phase: red, task: "1.1"}
        result:
          status: blocked
          questions:
            - title: Should a greeting trim the name?
              context: The scenario says "Hello, <name>!" but does not say what happens to surrounding spaces.
              kind: ambiguous
              options: ["trim it", "keep it as given"]
      - when: {phase: red, task: "1.1"}
        write:
          tests/test_greet.py: "@fixture:greet_red_tests.py"
          src/greeter.py: "@fixture:greet_red_stub.py"
      - when: {phase: green, task: "1.1"}
        write:
          src/greeter.py: "@fixture:greet_impl.py"
      - when: {phase: red, task: "1.2"}
        write:
          tests/test_farewell.py: "@fixture:farewell_red_tests.py"
          src/greeter.py: "@fixture:farewell_red_stub.py"
      - when: {phase: green, task: "1.2"}
        write:
          src/greeter.py: "@fixture:farewell_impl.py"
judges:
  judge:
    verdict: "@fixture:pass_all.json"
delegates:
  delegate:
    replies:
      - question: Q-001
        decision: answer
        text: "Trim it: `greet(\"  Ada \")` is `Hello, Ada!`."
        reason: The spec shows the greeting as `Hello, <name>!` for a name without padding, so the padding is dropped.
        checked:
          - ref: spec:specs/greeting/spec.md
            quote: "SHALL return `Hello, <name>!` for a non-blank name"
            claim: the requirement names the greeting without padding
expect:
  exit_code: 0
  final_phase: in_review
  events_include:
    - {type: question.raised, id: Q-001}
    - {type: phase.changed, to: awaiting_human, exit_code: 11}
    - {type: delegate.asked, question: Q-001}
    - {type: delegate.result, question: Q-001, status: answered}
    - {type: question.answered, id: Q-001, by: delegate}
    - {type: phase.changed, from: awaiting_human, to: implementing, trigger: answers_submitted}
    - {type: task.done, task: "1.1"}
    - {type: task.done, task: "1.2"}
    - {type: phase.changed, to: in_review}
