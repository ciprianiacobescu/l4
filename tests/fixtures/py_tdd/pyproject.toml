[project]
name = "pytdd"
version = "0.1.0"
description = "Fixture repository of the L4 implementer tests: one pending OpenSpec task on a tiny pytest project"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
